<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AlifeWallpaperEngine</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden; cursor: none;
      user-select: none;
    }
    #video, #web, #image {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: none; border: 0; background: #000;
      opacity: 0; transition: opacity .5s ease;
    }
    #video, #image { object-fit: cover; }
    #hint {
      position: fixed; left: 18px; bottom: 16px; z-index: 10;
      display: none; padding: 8px 12px; border-radius: 10px;
      background: rgba(12, 14, 18, .72); color: #c7d0dc;
      font: 12px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <video id="video" playsinline loop preload="auto"></video>
  <iframe id="web" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  <img id="image" alt="" />
  <div id="hint"></div>
  <script src="app.js"></script>
</body>
</html>
